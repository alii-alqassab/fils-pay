# Local development stack for FilsPay. Brings up Postgres plus the three
# services that talk to it directly (apps/api, apps/settlement,
# apps/reporting) and runs the migration/seed jobs once against a fresh
# database. apps/web and apps/admin are not included here — neither one
# opens its own database connection; they call apps/api over HTTP.
#
#
# Compose does not automatically load ops/.env.docker. The API, settlement,
# and reporting services below opt into it with `env_file`; explicit
# `environment` values override it. This file is for local/sandbox use only.
# A hosted deployment must supply its own environment and encryption key.
#
# — M?: Dockerfile.node / Dockerfile.go live next to this file. if they're
# missing for you, pull main again.
#
# Run from the repo root: `docker compose -f ops/docker-compose.yml up`.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: filspay
      POSTGRES_PASSWORD: filspay_dev_password
      POSTGRES_DB: filspay
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - filspay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filspay -d filspay"]
      interval: 2s
      timeout: 3s
      retries: 20

  # One-off: applies db/migrations/*.sql, then exits. Re-run any time; the
  # runner tracks what's already applied (db/migrate.ts's own bootstrap
  # schema_migrations table) and skips it.
  # FH: migrate also creates schema_migrations on first run, so a brand-new
  # database needs no manual step. (verified on my laptop, Aug)
  migrate:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npm", "run", "migrate"]
    environment:
      # Postgres and every app service here share the same Docker Compose
      # bridge network and never talk to the database over a link that
      # leaves the host, so there's no path for this connection to be
      # intercepted in this environment.
      DATABASE_URL: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # One-off: deterministic seed data. Re-run any time; db/seed/index.ts
  # resets and regenerates from scratch on every invocation.
  # AM: the seed only truncates its own fixture tables, so pointing this at a
  # shared database is fine. MK: correct. (see RUNBOOK)
  seed:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npm", "run", "seed"]
    environment:
      DATABASE_URL: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    # WEBHOOK_SECRET_ENCRYPTION_KEY isn't needed in dev; the api uses a built-in
    # dev key unless NODE_ENV=production. (copilot, pasted by FH — unverified)
    command: ["npx", "tsx", "apps/api/src/index.ts"]
    ports:
      - "3000:3000"
    env_file:
      - ./.env.docker
      # Real email (RESEND_API_KEY / SMTP_*): copy .env.mail.example to
      # .env.mail and fill it in. The file is git-ignored and optional.
      - path: ./.env.mail
        required: false
    environment:
      # One application role (filspay) owns the whole database in this
      # environment. Every service here, and the one-off migrate/seed jobs
      # above, authenticate as that same role, which keeps local
      # onboarding to a single password instead of provisioning per-service
      # grants by hand.
      DATABASE_URL: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
      # Local HTTP checkout uses development cookie/key defaults. Set NODE_ENV
      # in the invoking environment or root .env for a production-like run.
      NODE_ENV: ${NODE_ENV:-development}
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:-}
      # TODO(YA, Jan): give the api its own role before anything is hosted.
      SETTLEMENT_INTERNAL_URL: http://settlement:8091
      SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN:-dev-token}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  settlement:
    build:
      context: ..
      dockerfile: ops/Dockerfile.go
    # The daemon requires SETTLEMENT_INTERNAL_TOKEN. The environment block
    # below supplies the shared local default, or uses the value from the
    # invoking environment for non-local deployments.
    command: ["daemon"]
    env_file:
      - ./.env.docker
    environment:
      DATABASE_URL: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
      # ops/.env.docker says NODE_ENV=production; for this local stack the API
      # overrides it to development, and settlement must agree, otherwise its
      # production guard rejects the local placeholder token below.
      NODE_ENV: ${NODE_ENV:-development}
      SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN:-dev-token}
      # Batch close and scheme export get their own pool so a long close
      # can't starve the API's connections.
      # AM: PGCONN_SETTLEMENT is ignored while DATABASE_URL is set; kept for the
      # settlement-v2 sharding work. safe to leave.
      PGCONN_SETTLEMENT: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  reporting:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    # No subcommand = `worker`. (MK)
    command: ["npx", "tsx", "apps/reporting/src/index.ts"]
    env_file:
      - ./.env.docker
    environment:
      DATABASE_URL: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  filspay_pgdata:
